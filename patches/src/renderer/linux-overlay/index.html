<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden;
    font-family: "Noto Sans CJK SC","Source Han Sans SC",system-ui,sans-serif;
    -webkit-user-select: none; user-select: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: flex-start;
    padding: 10px; gap: 10px; flex-wrap: wrap; align-content: center; }
  #wrap.right { justify-content: flex-end; }
  #wrap.bottom { align-items: flex-end; }
  .card { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px;
    border-radius: 999px; background: rgba(18,18,20,.72); backdrop-filter: blur(8px);
    color: #e9e9ec; box-shadow: 0 4px 16px rgba(0,0,0,.35); transition: transform .12s ease, opacity .18s ease; }
  .card.talk { box-shadow: 0 0 0 2px #3ba55d, 0 4px 16px rgba(59,165,93,.35); }
  .avatar { width: var(--av, 32px); height: var(--av, 32px); border-radius: 50%; object-fit: cover;
    background: #2b2d31; flex: none; }
  .name { font-size: calc(var(--av, 32px) * .42); max-width: 160px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #3ba55d; margin-left: 2px; flex: none;
    animation: pulse 1s infinite ease-in-out; }
  @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
  .empty { color: rgba(255,255,255,.35); font-size: 12px; }
</style>
</head>
<body>
  <div id="wrap"></div>
  <script src="./index.js"></script>
</body>
</html>
